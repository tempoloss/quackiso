[package]
name = "quackiso"
version = "1.5.1"
edition = "2021"
description = "Query ISO 20022 (camt/pacs/pain) financial messages as SQL in DuckDB"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# src/wasm_lib.rs forwards to src/lib.rs so the crate-type can switch to
# staticlib for the wasm build (linking is done by emcc), while native builds
# stay cdylib. The forwarding needs a #[path] that upstream does not: see the
# comment in that file.
name = "quackiso"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
glob = "0.3"
parking_lot = "0.12"
# Statements arrive gzipped as often as not. `rust_backend` is miniz_oxide, so
# there is no C to cross-compile: the musl and wasm builds stay as plain as the
# glibc one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
