name: Tests

# What the repository could not answer until now: does it still work. The SQL
# suite is 650 lines of real messages and their expected rows -- the corpus this
# reader was written against, every fix in it pinned by a test -- and nothing ran
# it except a person remembering to type `make test`. The memory workflow next to
# this one proved the parser stays small while saying nothing about whether it
# stays right.
#
# Unit: the whole `cargo test` suite on Linux, macOS and Windows -- exact
# decimals, dates, compressed input, and the six bounded-memory cases that do
# not need a 1.7 GB fixture. Debug, so integer overflow panics instead of
# wrapping. Not `--lib`: plain `cargo test` also builds the Wasm example, which
# is how the shim in src/wasm_lib.rs stays compilable.
#
# Extension: build the extension against the DuckDB it targets, then run
# test/sql/quackiso.test through the same sqllogictest runner `make test` uses
# locally. Linux only: the runner is a pip package pinned to one DuckDB, and one
# platform proves the SQL contract.
#
# Unit (musl): the same suite, `--lib` only, against musl libc. Not because the extension ships
# there -- `community-extension/description.yml` excludes `linux_amd64_musl` -- and
# not because the recorded heap figures could move: the tracking allocator counts
# requested bytes, so mallocng's arenas and size classes are invisible to them by
# construction. What this covers is that the crate builds, links and passes under
# a second libc at all, including the miniz_oxide the gzip path pulls in, and the
# one measurement an allocator can move -- the resident-set ceiling. Un-excluding
# musl one day starts with this being green. Run through docker rather than
# `container:` -- the runner injects a glibc-linked node for every action, which
# an Alpine container cannot execute.
on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit
    runs-on: ${{ matrix.os }}
    # A test that feeds a FIFO can only hang, never fail, so every job here is
    # bounded rather than left to the six-hour default.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: unit-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Run the unit tests
        run: cargo test -- --nocapture

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The extension is built against one DuckDB and refuses to load into
      # another, so the test runner is pinned to the Makefile's target rather
      # than to whatever pip calls latest.
      DUCKDB_TEST_VERSION: 1.5.5

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: extension-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the extension
        run: make configure debug

      - name: Run the SQL suite
        run: make test

  musl:
    name: Unit (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Run the unit tests against musl libc
        # The target directory goes to /tmp: the container is root, and a
        # root-owned `target/` in the workspace is a trap for whatever step comes
        # after this one.
        run: |
          docker run --rm -v "$PWD":/work -w /work -e CARGO_TARGET_DIR=/tmp/target \
            rust:1-alpine sh -c '
              apk add --no-cache musl-dev >/dev/null &&
              cargo test --lib -- --nocapture
            '
