name: Memory

# README.md claims a 1.7 GB statement reads in about 2 MB of resident memory,
# that the same scan adds under 8 MiB to a running DuckDB, that eight workers on
# a glob stay inside their batches, and that returning the rows instead of
# aggregating them is a different budget. A claim is worth the measurement behind
# it, and a measurement nobody runs decays into a number someone once saw. This
# workflow runs all of them, and gates the DuckDB scan with the 16 MiB default
# ceiling of scripts/measure_in_duckdb.py: the 8 MiB README figure is printed,
# not enforced.
#
# The bounds themselves also run in the Tests workflow, on three platforms in
# debug. Here they run in release, beside the build that the DuckDB measurement
# needs anyway, because that is the build people load.
#
# On every push: the seven bounded-memory cases that need no 1.7 GB fixture --
# the eighth is that fixture -- then a live DuckDB scanning a statement written by
# the same generator, its parallel glob path, and the result set it refuses to
# hold. Ubuntu only -- the resident half of the measurement needs
# /proc/self/clear_refs, which is the one place a peak can be reset.
#
# Weekly, and on demand: the documented size, three million entries and 1.7 GB.
# That is the number in the README, so it is checked on a schedule rather than
# whenever someone remembers to pass --ignored.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      reproduce:
        description: measure at the documented 1.7 GB size
        type: boolean
        default: false

# The documented size for the weekly run and for a deliberate dispatch; a tenth
# of it on a push, where the point is that the measurement still runs.
env:
  FULL_SIZE: ${{ github.event_name == 'schedule' || github.event.inputs.reproduce == 'true' }}

jobs:
  duckdb:
    name: In DuckDB
    runs-on: ubuntu-latest
    # The weekly run writes a 1.7 GB fixture, parses it and hardlinks eight
    # copies; a stall would otherwise burn the six-hour default with no signal.
    timeout-minutes: 90

    env:
      # The extension is built against one DuckDB and refuses to load into
      # another, so the test runner is pinned to the Makefile's target rather
      # than to whatever pip calls latest.
      DUCKDB_TEST_VERSION: 1.5.5
      FIXTURE: /tmp/quackiso-membound-documented.xml

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: memory-duckdb-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the extension
        run: make configure release

      - name: Measure the memory boundary
        run: cargo test --release --lib membound -- --nocapture

      - name: Write the statement
        env:
          QUACKISO_MEMBOUND_KEEP: /tmp
          QUACKISO_MEMBOUND_ENTRIES: ${{ env.FULL_SIZE == 'true' && '3000000' || '300000' }}
        run: cargo test --release --lib the_documented_statement -- --ignored --nocapture

      # --materialise only at the small size. The claim it checks is a ratio,
      # not a size, and three million rows handed back to Python is gigabytes of
      # tuples for no extra information.
      - name: Measure what the scan adds to DuckDB
        run: |
          configure/venv/bin/python3 scripts/measure_in_duckdb.py \
            --fixture "$FIXTURE" --glob-copies 8 \
            ${{ env.FULL_SIZE == 'true' && ' ' || '--materialise' }}

      - name: Drop the statement
        if: always()
        run: rm -f "$FIXTURE"
