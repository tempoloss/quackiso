name: Memory

# README.md claims a 1.7 GB statement reads in about 2 MB of resident memory,
# that the same scan adds under 8 MiB to a running DuckDB, and that returning
# the rows instead of aggregating them is a different budget. A claim is worth
# the measurement behind it, and a measurement nobody runs decays into a number
# someone once saw. This workflow runs all of them.
#
# In DuckDB, on every push (ubuntu): one release build, used twice — the six
# bounded-memory cases in src/membound.rs, then a live DuckDB scanning a
# statement written by the same generator, its parallel glob path, and the
# result set it refuses to hold. Ubuntu only, because the resident-set half of
# the measurement needs /proc/self/clear_refs.
#
# Bound, on every push (macOS, Windows): the same cases, minus the resident
# figures the platform will not reset. The live-heap bound is byte-identical
# everywhere, so this holds it there too — and is the only thing in CI that
# builds the crate off Linux at all.
#
# Weekly, and on demand: the documented size, three million entries and 1.7 GB.
# That is the number in the README, so it is checked on a schedule rather than
# whenever someone remembers to pass --ignored.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      reproduce:
        description: measure at the documented 1.7 GB size
        type: boolean
        default: false

# The documented size for the weekly run and for a deliberate dispatch; a tenth
# of it on a push, where the point is that the measurement still runs.
env:
  FULL_SIZE: ${{ github.event_name == 'schedule' || github.event.inputs.reproduce == 'true' }}

jobs:
  duckdb:
    name: In DuckDB
    runs-on: ubuntu-latest

    env:
      # The extension is built against one DuckDB and refuses to load into
      # another, so the test runner is pinned to the Makefile's target rather
      # than to whatever pip calls latest.
      DUCKDB_TEST_VERSION: 1.5.5
      FIXTURE: /tmp/quackiso-membound-documented.xml

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: memory-duckdb-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the extension
        run: make configure release

      - name: Measure the memory boundary
        run: cargo test --release --lib membound -- --nocapture

      - name: Write the statement
        env:
          QUACKISO_MEMBOUND_KEEP: /tmp
          QUACKISO_MEMBOUND_ENTRIES: ${{ env.FULL_SIZE == 'true' && '3000000' || '300000' }}
        run: cargo test --release --lib the_documented_statement -- --ignored --nocapture

      - name: Measure what the scan adds to DuckDB
        run: |
          configure/venv/bin/python3 scripts/measure_in_duckdb.py \
            --fixture "$FIXTURE" --glob-copies 8 --materialise

      - name: Drop the statement
        if: always()
        run: rm -f "$FIXTURE"

  bound:
    name: Bound
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: memory-bound-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Measure the memory boundary
        run: cargo test --lib membound -- --nocapture

      - name: Reproduce the documented 1.7 GB statement
        if: env.FULL_SIZE == 'true'
        run: cargo test --release --lib membound -- --ignored --nocapture
